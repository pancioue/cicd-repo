name: CI - PR

on:
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint (workflows + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ✅ 檢查 .github/workflows/*.yml
      - name: actionlint
        uses: raven-actions/actionlint@v1

      # ✅ 檢查 Dockerfile
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress

      # ✅ 低成本靜態驗證
      - name: Composer validate (strict)
        working-directory: app
        run: composer validate --strict

      - name: PHP syntax check (php -l)
        working-directory: app
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      # ✅ Larastan / PHPStan
      - name: Static analysis (Larastan/PHPStan)
        working-directory: app
        run: |
          vendor/bin/phpstan analyse -c phpstan.neon

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build only (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            APP_ENV=production
          cache-from: type=gha # 快取加速用
          cache-to: type=gha,mode=max # 快取加速用

